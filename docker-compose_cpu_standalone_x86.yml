# TestCase Platform - Customer local setup (x86 / amd64)
# Images: aiqualitica/aiqualitica:<service>-x86
# Configure required secrets in .env (see env.template)

x-common-env: &common-env
  DEBUG: ${DEBUG:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  STRUCTURED_LOGGING: ${STRUCTURED_LOGGING:-true}
  CORRELATION_ENABLED: ${CORRELATION_ENABLED:-true}
  REQUEST_ID_ENABLED: ${REQUEST_ID_ENABLED:-true}
  USER_ID_ENABLED: ${USER_ID_ENABLED:-true}
  SLOW_REQUEST_THRESHOLD_MS: ${SLOW_REQUEST_THRESHOLD_MS:-1000}
  PERFORMANCE_LOGGING: ${PERFORMANCE_LOGGING:-true}
  LOG_TO_ELK: ${LOG_TO_ELK:-false}
  IS_EMBEDDED: false
  LLM_TYPE: ${LLM_TYPE:-openai}
  LLM_DEPLOYMENT_TYPE: ${LLM_DEPLOYMENT_TYPE:-api}
  LLM_MODEL_PATH: ${LLM_MODEL_PATH:-gpt-4.1}
  LLM_API_KEY: ${LLM_API_KEY:-}
  MAX_TOKENS: ${MAX_TOKENS:-4096}
  CTX: ${CTX:-32768}
  VLLM_BASE_URL: ${VLLM_BASE_URL:-http://vllm-service:8000/v1}
  TESTCASE_DB_SERVICE_URL: http://testcase-db-service:8000
  REQUIREMENT_SERVICE_URL: http://requirement-service:8000
  EVENT_QUEUE_MANAGER_URL: http://event-queue-manager:8001
  LLM_SERVICE_URL: http://llm-service:8000
  VECTOR_STORE_URL: http://weaviate:8080
  TCM_INTEGRATOR_SERVICE_URL: http://tcm-integrator-service:8004
  DOCUMENT_PREPROCESSOR_URL: http://document-preprocessor:8000
  IAM_SERVICE_URL: http://iam-service:8000

x-common-volumes: &common-volumes
  - ./logs:/var/log

x-common-networks: &common-networks
  - testcase-network

services:
  testcase-manager:
    image: aiqualitica/aiqualitica:testcase-manager-svc-x86
    pull_policy: if_not_present
    container_name: testcase-manager
    ports:
      - "${TESTCASE_MANAGER_PORT:-8007}:8000"
    environment:
      <<: *common-env
      LOG_FILE: ${LOG_FILE:-/var/log/testcase-manager.log}
      EVENT_QUEUE_URL: http://event-queue-manager:8001
    volumes: *common-volumes
    networks: *common-networks
    depends_on:
      - testcase-db-service

  api-gw-service:
    image: aiqualitica/aiqualitica:api-gw-service-x86
    pull_policy: if_not_present
    container_name: api-gw-service
    ports:
      - "${API_LAYER_PORT:-8000}:8000"
    environment:
      <<: *common-env
      LOG_FILE: ${LOG_FILE:-/var/log/api-gw-service.log}
      JWT_SECRET: ${JWT_SECRET:-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}
      JWT_ISSUER: ${JWT_ISSUER:-iam.testcase-platform}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-testcase-platform}
      JWT_LEEWAY_SECONDS: 30
      TESTCASE_MANAGER_URL: http://testcase-manager:8000
      GATEWAY_TIMEOUT: 600
      CORS_ALLOWED_ORIGINS: '["http://localhost", "http://localhost:3000", "http://localhost:80"]'
      REDIRECT_URL: ${REDIRECT_URL:-/}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:-http://keycloak:8080}
      KEYCLOAK_JWKS_CACHE_TTL: ${KEYCLOAK_JWKS_CACHE_TTL:-3600}
      REALM_MAPPING_CACHE_TTL: ${REALM_MAPPING_CACHE_TTL:-3600}
    volumes: *common-volumes
    networks: *common-networks
    depends_on:
      - testcase-manager
      - requirement-service
      - tcm-integrator-service
      - iam-service
      - keycloak

  mcp-gateway:
    image: aiqualitica/aiqualitica:mcp-gateway-x86
    pull_policy: if_not_present
    container_name: mcp-gateway
    ports:
      - "${CONTEXTFORGE_GATEWAY_PORT:-8080}:8080"
    environment:
      <<: *common-env
      LOG_FILE: /var/log/mcp-gateway.log
      JWT_SECRET: ${JWT_SECRET:-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}
      JWT_ISSUER: ${JWT_ISSUER:-iam.testcase-platform}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-testcase-platform}
      JWT_LEEWAY_SECONDS: ${JWT_LEEWAY_SECONDS:-30}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://testcase-manager:8000}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:-http://keycloak:8080}
      KEYCLOAK_JWKS_CACHE_TTL: ${KEYCLOAK_JWKS_CACHE_TTL:-3600}
      REALM_MAPPING_CACHE_TTL: ${REALM_MAPPING_CACHE_TTL:-3600}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./config/gateway.yaml:/etc/granite/config.yaml:ro
      - ./logs:/var/log
    networks: *common-networks
    depends_on:
      - testcase-manager
      - iam-service
      - keycloak
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(); result = s.connect_ex(('localhost', 8080)); s.close(); exit(0 if result == 0 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  llm-service:
    image: aiqualitica/aiqualitica:llm-service-x86
    pull_policy: if_not_present
    container_name: llm-service
    ports:
      - "${LLM_SERVICE_PORT:-8002}:8000"
    environment:
      <<: *common-env
      PYTHONDONTWRITEBYTECODE: 1
      LOG_FILE: ${LOG_FILE:-/var/log/llm-service.log}
      TESTCASE_MANAGER_URL: http://testcase-manager:8000
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      WEBSEARCH_SERVICE_URL: ""
      BRAVE_SEARCH_API_KEY: ""
      API_SERVICE_URL: http://api-gw-service:8000
      LLM_INFERENCE_ENGINE_URL: http://llm-service:8000
      GRAPH_DB_URL: bolt://neo4j:7687
      GRAPH_DB_BOLT_URL: bolt://neo4j:7687
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/testcase_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: testcase_db
      REDIS_HOST: redis
      NEO4J_AUTH: neo4j/password
      GRAPH_DB_USER: neo4j
      GRAPH_DB_PASSWORD: password
      CHROMA_HOST: weaviate
    volumes:
      - ./logs:/var/log
      - ./models:/app/models
    networks: *common-networks
    depends_on:
      - weaviate
      - neo4j

  testcase-db-service:
    image: aiqualitica/aiqualitica:testcase-db-service-x86
    pull_policy: if_not_present
    container_name: testcase-db-service
    ports:
      - "${TESTCASE_DB_SERVICE_PORT:-8004}:8000"
    environment:
      <<: *common-env
      LOG_FILE: ${LOG_FILE:-/var/log/testcase-db-service.log}
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/testcase_db
    volumes: *common-volumes
    networks: *common-networks
    depends_on:
      - postgres

  tcm-integrator-service:
    image: aiqualitica/aiqualitica:tcm-integrator-service-x86
    pull_policy: if_not_present
    container_name: tcm-integrator-service
    ports:
      - "${TCM_INTEGRATOR_SERVICE_PORT:-8005}:8004"
    environment:
      <<: *common-env
      LOG_FILE: ${LOG_FILE:-/var/log/tcm-integrator-service.log}
      EXTERNAL_SERVICE_TIMEOUT: ${EXTERNAL_SERVICE_TIMEOUT:-30}
    volumes: *common-volumes
    networks: *common-networks
    depends_on:
      - testcase-db-service

  iam-service:
    image: aiqualitica/aiqualitica:iam-service-x86
    pull_policy: if_not_present
    container_name: iam-service
    ports:
      - "${IAM_SERVICE_PORT:-8001}:8000"
    environment:
      <<: *common-env
      LOG_FILE: /var/log/iam-service.log
      JWT_SECRET: ${JWT_SECRET:-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}
      JWT_ISSUER: iam.testcase-platform
      JWT_AUDIENCE: testcase-platform
      JWT_TTL_SECONDS: 1800
      JWT_LEEWAY_SECONDS: 30
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost/api/v1/auth/oauth/google/callback}
      GENERIC_EMAIL_DOMAINS: gmail.com,yahoo.com,outlook.com,hotmail.com,protonmail.com
      DEPLOYMENT_MODE: standalone
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:-http://keycloak:8080}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8090}
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_ADMIN_REALM:-master}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-admin-cli}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_DEFAULT_UI_CLIENT_ID: ${KEYCLOAK_DEFAULT_UI_CLIENT_ID:-aiqualitica-ui}
      KEYCLOAK_DEFAULT_API_CLIENT_ID: ${KEYCLOAK_DEFAULT_API_CLIENT_ID:-aiqualitica-api}
      KEYCLOAK_CLIENT_ROOT_URL: ${KEYCLOAK_CLIENT_ROOT_URL:-http://localhost}
      KEYCLOAK_CLIENT_REDIRECT_URIS: ${KEYCLOAK_CLIENT_REDIRECT_URIS:-http://localhost/auth/callback,http://localhost:3000/auth/callback,http://localhost:80/auth/callback}
      KEYCLOAK_CLIENT_WEB_ORIGINS: ${KEYCLOAK_CLIENT_WEB_ORIGINS:-http://localhost,http://localhost:3000}
    volumes: *common-volumes
    networks: *common-networks
    depends_on:
      - testcase-db-service
      - keycloak

  requirement-service:
    image: aiqualitica/aiqualitica:requirement-service-x86
    pull_policy: if_not_present
    container_name: requirement-service
    ports:
      - "${REQUIREMENT_SERVICE_PORT:-8003}:8000"
    environment:
      <<: *common-env
      LOG_FILE: ${LOG_FILE:-/var/log/requirement-service.log}
      EVENT_QUEUE_URL: http://event-queue-manager:8001
      DB_SERVICE_URL: http://testcase-db-service:8000
    volumes: *common-volumes
    networks: *common-networks

  document-preprocessor:
    image: aiqualitica/aiqualitica:document-preprocessor-x86
    pull_policy: if_not_present
    container_name: document-preprocessor
    ports:
      - "${DOCUMENT_PREPROCESSOR_PORT:-8008}:8000"
    environment:
      <<: *common-env
      LOG_FILE: ${LOG_FILE:-/var/log/document-preprocessor.log}
      LLM_SERVICE_TIMEOUT: ${LLM_SERVICE_TIMEOUT:-600}
    volumes:
      - ./logs:/var/log
      - ./uploads:/app/uploads
    networks: *common-networks

  event-queue-manager:
    image: aiqualitica/aiqualitica:event-queue-manager-x86
    pull_policy: if_not_present
    container_name: event-queue-manager
    ports:
      - "${EVENT_QUEUE_MANAGER_PORT:-8006}:8001"
    environment:
      <<: *common-env
      LOG_FILE: ${LOG_FILE:-/var/log/event-queue-manager.log}
      QUEUE_BACKEND: redis
      REDIS_HOST: redis
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    volumes: *common-volumes
    networks: *common-networks
    depends_on:
      - rabbitmq
      - redis

  nginx-standalone:
    image: nginx:alpine
    container_name: nginx-standalone
    ports:
      - "${UI_PORT:-80}:80"
      - "443:443"
    depends_on:
      - testcase-tool-standalone
      - mcp-gateway
    networks: *common-networks
    restart: unless-stopped
    volumes:
      - ./nginx.standalone.conf:/etc/nginx/conf.d/default.conf

  testcase-tool-standalone:
    image: aiqualitica/aiqualitica:testcase-tool-standalone-x86
    pull_policy: if_not_present
    container_name: testcase-tool-standalone
    networks: *common-networks
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - api-gw-service
      - mcp-gateway

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=testcase_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-keycloak-db.sh:/docker-entrypoint-initdb.d/01-init-keycloak-db.sh:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks: *common-networks
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testcase_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: *common-networks

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    networks: *common-networks

  weaviate:
    image: semitechnologies/weaviate:latest
    ports:
      - "${WEAVIATE_PORT:-8082}:8080"
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - ENABLE_MODULES=text2vec-openai,text2vec-cohere,text2vec-huggingface,ref2vec-centroid,generative-openai,qna-openai
      - CLUSTER_HOSTNAME=node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks: *common-networks

  neo4j:
    image: neo4j:5.19
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      - NEO4J_AUTH=neo4j/password
    networks: *common-networks

  keycloak:
    image: aiqualitica/aiqualitica:keycloak-x86
    pull_policy: if_not_present
    container_name: keycloak
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=password
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
      - KC_HTTP_PORT=8080
      - KC_HTTPS_PORT=8443
      - KC_PROXY=edge
      - KC_PROXY_ADDRESS_FORWARDING=true
      - KC_EVENTS_LISTENER=aiqualitica-user-onboarding
      - KC_EVENTS_LISTENER_AIQUALITICA_USER_ONBOARDING_IAM_SERVICE_URL=http://iam-service:8000
      - KC_EVENTS_LISTENER_AIQUALITICA_USER_ONBOARDING_IAM_SERVICE_ENDPOINT=/api/v1/internal/iam/keycloak-event
      - KC_EVENTS_ADMIN_ENABLED=true
      - KC_EVENTS_ADMIN_SAVE=true
    ports:
      - "${KEYCLOAK_PORT:-8090}:8080"
    networks: *common-networks
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  keycloak-one-time-setup:
    image: python:3.11-slim
    container_name: keycloak-one-time-setup
    environment:
      - KEYCLOAK_BASE_URL=http://keycloak:8080
      - KEYCLOAK_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - ./scripts/keycloak-one-time-setup.sh:/setup.sh:ro
      - ./scripts:/app/scripts:ro
    command: >
      sh -c "
        apt-get update -qq &&
        apt-get install -y -qq curl >/dev/null 2>&1 &&
        pip install -q httpx >/dev/null 2>&1 &&
        sh /setup.sh || exit 1
      "
    networks: *common-networks
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  rabbitmq_data:
  weaviate_data:

networks:
  testcase-network:
    driver: bridge
