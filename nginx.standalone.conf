# Resolver for Docker DNS
resolver 127.0.0.11 valid=30s;

server {
    listen 80;
    server_name localhost;
    
    # Increase buffer sizes globally for this server to handle large headers (cookies, tokens)
    large_client_header_buffers 8 32k;
    
    # Proxy API requests to API Gateway
    location /api/ {
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $http_origin;
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, X-Tenant-Id, X-User-Id, X-User-Email, X-User-Roles";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }
        
        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "fullscreen=(self)" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://apis.google.com https://www.gstatic.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http://localhost ws://localhost http://127.0.0.1 ws://127.0.0.1 https://accounts.google.com https://cloudflareinsights.com; frame-src 'self' https://accounts.google.com;" always;
        
        # CORS headers for authentication
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, X-Tenant-Id, X-User-Id, X-User-Email, X-User-Roles" always;
        
        set $api_gw_service "api-gw-service:8000";
        proxy_pass http://$api_gw_service;
        
        # Timeout configurations for long-running requests
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Forward authentication headers
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        
        # Handle authentication cookies
        proxy_cookie_path / "/";
        proxy_cookie_domain api-gw-service $host;
    }

    # Proxy WebSocket connections to ContextForge MCP Gateway
    # Gateway handles JWT validation and routes to TestCase Manager
    location /ws {
        set $mcp_gateway "mcp-gateway:8080";
        proxy_pass http://$mcp_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeouts
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        
        # Forward authentication headers
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }
    
    # Proxy SSE (Server-Sent Events) connections to ContextForge MCP Gateway
    # Gateway streams events from TestCase Manager to UI
    location /events {
        set $mcp_gateway "mcp-gateway:8080";
        proxy_pass http://$mcp_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE-specific settings
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        
        # Forward authentication headers
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        
        # SSE headers
        add_header Cache-Control "no-cache";
        add_header X-Accel-Buffering "no";
    }

    # Auth callback route - proxy to API Gateway
    # Keycloak redirects to /auth/callback, but API Gateway expects /api/v1/auth/callback
    location /auth/callback {
        # Increase buffer sizes to handle large headers (cookies, tokens)
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        
        # Proxy to API Gateway callback endpoint
        # Use $request_uri to preserve query parameters (code, state, etc.)
        set $api_gw "api-gw-service:8000";
        # Rewrite the path but preserve query string
        rewrite ^/auth/callback(.*)$ /api/v1/auth/callback$1 break;
        proxy_pass http://$api_gw;
        
        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "fullscreen=(self)" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # CORS headers for authentication
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        
        # Forward query parameters explicitly
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Query-String $args;
        
        # Handle authentication cookies
        proxy_cookie_path / "/";
    }
    
    # TestCase Tool Assets - handle assets first (before root location)
    location /assets/ {
        set $testcase_tool "testcase-tool-standalone:3000";
        proxy_pass http://$testcase_tool;
        
        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "fullscreen=(self)" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Cache static assets
        expires 1d;
        add_header Cache-Control "public, immutable";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Proxy all other requests to standalone testcase tool
    location / {
        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "fullscreen=(self)" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://apis.google.com https://www.gstatic.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http://localhost ws://localhost http://127.0.0.1 ws://127.0.0.1 https://accounts.google.com https://cloudflareinsights.com; frame-src 'self' https://accounts.google.com;" always;
        
        # CORS headers for authentication
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, X-Tenant-Id, X-User-Id, X-User-Email, X-User-Roles" always;
        
        set $testcase_tool "testcase-tool-standalone:3000";
        proxy_pass http://$testcase_tool/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Forward authentication headers
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        
        # Handle authentication cookies
        proxy_cookie_path / "/";
        proxy_cookie_domain testcase-tool-standalone $host;
        
        # Cache control for SPA
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
} 